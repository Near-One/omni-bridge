name: UTXO Light Client CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'light-clients/utxo/**'
      - '.github/workflows/light-client-utxo.yaml'
  pull_request:
    paths:
      - 'light-clients/utxo/**'
      - '.github/workflows/light-client-utxo.yaml'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: light-clients/utxo

jobs:
  check-and-test:
    name: Lint and test (${{ matrix.feature }})
    runs-on: warp-ubuntu-2404-x64-16x
    strategy:
      fail-fast: false
      matrix:
        feature: [bitcoin, dogecoin, litecoin, zcash]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          target: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          shared-key: "light-client-utxo-${{ matrix.feature }}"
          workspaces: |
            light-clients/utxo/contract
          cache-on-failure: true

      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Run fmt
        run: make fmt-${{ matrix.feature }}

      - name: Run clippy
        run: make clippy-${{ matrix.feature }}

      - name: Run tests
        run: make test-${{ matrix.feature }}
