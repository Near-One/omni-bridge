name: ETH2 Light Client CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'light-clients/eth2/**'
      - '.github/workflows/light-client-eth2.yaml'
  pull_request:
    paths:
      - 'light-clients/eth2/**'
      - '.github/workflows/light-client-eth2.yaml'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: light-clients/eth2

jobs:
  lint:
    runs-on: warp-ubuntu-2404-x64-16x
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: clippy, rustfmt
          target: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          shared-key: "light-client-eth2-lint"
          workspaces: |
            light-clients/eth2
          cache-on-failure: true

      - name: Run fmt
        run: make fmt

      - name: Run clippy
        run: make clippy

  build-and-test:
    runs-on: warp-ubuntu-2404-x64-16x
    steps:
      # Test fixtures under eth2-client/src/data are stored in Git LFS
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          target: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          shared-key: "light-client-eth2-test"
          workspaces: |
            light-clients/eth2
          cache-on-failure: true

      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Build reproducible WASM
        run: make build-eth2-client
        timeout-minutes: 40

      - name: Run tests
        run: make test
        timeout-minutes: 40
